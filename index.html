<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>같이봐요</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --canvas:#f2eeea; --surface:#fbfaf8; --well:#ebe6e1; --ink:#1d2330; --sub:#707784; --faint:#a3a8b1;
  --line:#e4ded8; --blue:#2e6ae6; --coral:#ee6352; --green:#23b37a; --screen:#161a22;
  --raise:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(70,50,35,.08), 0 6px 18px rgba(70,50,35,.09);
  --raise-hi:0 1px 0 rgba(255,255,255,.9) inset, 0 2px 4px rgba(70,50,35,.1), 0 10px 26px rgba(70,50,35,.13);
  --press:0 2px 6px rgba(46,106,230,.35), 0 8px 18px rgba(46,106,230,.25);
  font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 90% at 20% 0%,#f8f4f0 0%,var(--canvas) 55%,#ece6e0 100%) fixed;color:var(--ink);
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid rgba(46,106,230,.45);outline-offset:2px;border-radius:12px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
[hidden]{display:none !important}

/* ─── 입장 ─── */
#entry{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.ecard{width:100%;max-width:420px;background:var(--surface);border-radius:28px;box-shadow:var(--raise-hi);padding:32px 28px 28px}
.ecard h1{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.ecard .lead{color:var(--sub);margin:0 0 24px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--sub);margin:0 0 8px}
.tin{width:100%;height:52px;padding:0 16px;border-radius:16px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:600;transition:border-color .15s}
.tin:focus{outline:none;border-color:var(--blue)}
.tin.bad{border-color:var(--coral);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.choice{display:flex;align-items:center;gap:14px;width:100%;height:60px;padding:0 20px;border-radius:18px;background:var(--surface);
  box-shadow:var(--raise);font-size:17px;font-weight:700;text-align:left;transition:transform .12s, box-shadow .12s, background .15s}
.choice:hover{box-shadow:var(--raise-hi)}
.choice:active{transform:translateY(1px)}
.choice:disabled{opacity:.6;cursor:default}
.choice svg.i{width:24px;height:24px;color:#4a5160}
.choice small{margin-left:auto;font-size:13px;font-weight:500;color:var(--faint)}
.choice.on{background:var(--blue);color:#fff;box-shadow:var(--press)}
.choice.on svg.i,.choice.on small{color:rgba(255,255,255,.85)}
.choice.ghost{height:48px;box-shadow:none;background:transparent;border:1.5px dashed var(--line);font-size:15px;color:var(--sub)}
.choice.ghost:hover{border-color:var(--faint);box-shadow:none}
.joinbox{display:flex;gap:10px}
.joinbox .tin{flex:1;letter-spacing:.2em;text-transform:uppercase;text-align:center;font-size:20px;font-weight:800}
.joinbox .tin::placeholder{letter-spacing:0;font-size:15px;font-weight:500;text-transform:none}
.gobtn{height:52px;padding:0 22px;border-radius:16px;background:var(--blue);color:#fff;font-weight:700;box-shadow:var(--press)}
.gobtn:disabled{opacity:.6}
.eerr{color:var(--coral);font-size:14px;font-weight:600;margin-top:14px}

/* ─── 방 ─── */
#room{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(46,106,230,.15)}
.roompill{display:flex;align-items:center;gap:10px;height:38px;padding:0 5px 0 14px;border-radius:13px;background:var(--surface);box-shadow:var(--raise);margin-left:6px}
.roompill span{font-size:13px;color:var(--sub);font-weight:600}
.roompill b{font-size:17px;font-weight:800;letter-spacing:.14em}
.roompill button{height:28px;padding:0 11px;border-radius:9px;background:var(--well);font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.roompill button svg.i{width:14px;height:14px}
.roompill button:hover{background:#e2dcd6}
.stat{margin-left:auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:13px;background:var(--surface);box-shadow:var(--raise);font-size:13.5px;font-weight:600}
.stat i{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.fsbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 13px;border-radius:13px;background:var(--surface);box-shadow:var(--raise);font-size:13px;font-weight:700;color:#4a5160}
.fsbtn:hover{box-shadow:var(--raise-hi)}
.fsbtn svg.i{width:16px;height:16px}
.stat.st-live i{background:var(--green)}
.stat.st-wait i{background:#f0a52a;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}

.body{display:grid;grid-template-columns:1fr 340px;gap:14px;padding:0 18px 16px;min-height:0}

/* 공유 화면 */
.stage{position:relative;background:rgba(255,255,255,.45);border-radius:22px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7), 0 1px 2px rgba(70,50,35,.05);
  padding:16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.shead{display:flex;align-items:baseline;gap:8px;margin:0 4px 12px}
.shead h2{font-size:16px;font-weight:800;margin:0;letter-spacing:-.02em}
.shead span{font-size:13px;color:var(--sub);font-weight:600}
.shead em{margin-left:auto;font-style:normal;font-size:12.5px;color:var(--faint)}
#viewer{display:none;flex:1 1 auto;min-height:0;flex-direction:column;background:var(--screen);border-radius:16px;overflow:hidden;position:relative}
.stage.focused #viewer{display:flex}
.stage.focused .shead{display:none}
#viewer video{flex:1 1 auto;min-height:0;width:100%;object-fit:contain;background:var(--screen)}
#viewer video.mirror{transform:scaleX(-1)}
.stage.camfocus #viewer video{object-fit:cover}
.pt{cursor:pointer}
.pt.slot{cursor:default}
.pt.bigcam{box-shadow:0 0 0 3px var(--blue)}
.vbar{position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:8px;pointer-events:none}
.vchip{pointer-events:auto;display:flex;align-items:center;gap:8px;height:34px;padding:0 13px 0 4px;border-radius:11px;background:rgba(255,255,255,.93);font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vbtn{pointer-events:auto;height:34px;padding:0 11px;border-radius:11px;background:rgba(255,255,255,.93);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.vbtn:hover{background:#fff}
.vbtn svg.i{width:16px;height:16px}
.vbar .vbtn:first-of-type{margin-left:auto}
.av{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff;flex:0 0 auto}

#shares{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;align-content:start;overflow:auto;min-height:0;padding:2px}
.stage.focused #shares{display:none}
.stage.focused.one #shares{display:none}
.scard{display:block;text-align:left;background:var(--surface);border-radius:16px;box-shadow:var(--raise);padding:7px;transition:box-shadow .15s, transform .12s}
.scard:hover{box-shadow:var(--raise-hi)}
.scard:active{transform:translateY(1px)}
.stage.focused .scard{width:150px;flex:0 0 auto;padding:4px;border-radius:12px}
.scard.active{box-shadow:0 0 0 2.5px var(--blue), var(--raise)}
.sthumb{position:relative;aspect-ratio:16/9;background:var(--screen);border-radius:11px;overflow:hidden}
.sthumb video{width:100%;height:100%;object-fit:contain;display:block}
.livebadge{position:absolute;left:7px;top:7px;height:19px;padding:0 6px;border-radius:6px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;gap:4px}
.livebadge::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff}
.sfoot{display:flex;align-items:center;gap:8px;padding:9px 5px 3px}
.sfoot b{font-size:14.5px;font-weight:800}
.sfoot .sub{font-size:13px;color:var(--sub);font-weight:500}
.sfoot .open{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--blue);font-size:12.5px;font-weight:700}
.sfoot .open svg.i{width:14px;height:14px}
.stage.focused .sfoot{padding:6px 3px 1px}
.stage.focused .sfoot .sub,.stage.focused .sfoot .open,.stage.focused .sfoot .av{display:none}
.stage.focused .sfoot b{font-size:12.5px}

#sempty{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--sub)}
.stage:not(.none) #sempty{display:none}
#sempty .ic{width:64px;height:64px;border-radius:20px;background:var(--surface);box-shadow:var(--raise);display:flex;align-items:center;justify-content:center;color:#4a5160;margin-bottom:16px}
#sempty .ic svg.i{width:28px;height:28px}
#sempty h3{margin:0 0 6px;color:var(--ink);font-size:18px;font-weight:800;letter-spacing:-.02em}
#sempty p{margin:0;max-width:32ch;font-size:14px}
.invite{margin-top:20px;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:16px;background:var(--surface);box-shadow:var(--raise)}
.invite span{font-size:13px;font-weight:600}
.invite b{font-size:24px;font-weight:800;letter-spacing:.16em;color:var(--ink)}
.invite button{height:38px;padding:0 14px;border-radius:11px;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:var(--press)}
.invite button svg.i{width:15px;height:15px}

/* 오른쪽 */
.side{display:flex;flex-direction:column;gap:12px;min-height:0}
.panel{background:var(--surface);border-radius:20px;box-shadow:var(--raise);min-height:0}
.phead{display:flex;align-items:center;gap:7px;padding:12px 16px 0}
.phead h2{font-size:14px;font-weight:800;margin:0}
.phead span{font-size:13px;color:var(--sub);font-weight:700}
#hostname{margin-left:auto;font-size:12px;font-weight:700;color:#c07d10;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:11rem}
.ppl{flex:0 0 auto}
#people{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:10px 12px 12px}
.pt{position:relative;border-radius:14px;background:var(--well);overflow:hidden;aspect-ratio:4/3;transition:box-shadow .15s}
.pt.speaking{box-shadow:0 0 0 3px var(--green)}
.pt video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.pt.me video{transform:scaleX(-1)}
.pt.camon video{display:block}
.pt .big{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.pt.camon .big{display:none}
.pt .big .av{width:46px;height:46px;border-radius:15px;font-size:20px}
.pt .nm{position:absolute;left:5px;right:5px;bottom:5px;display:flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:8px;
  background:rgba(255,255,255,.92);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.pt .nm .t{overflow:hidden;text-overflow:ellipsis}
.pt .nm svg.i{width:13px;height:13px;margin-left:auto;color:var(--coral);display:none}
.pt.micoff .nm svg.i{display:block}
.pt .nm .crown{display:none;flex:0 0 auto;align-items:center;height:15px;padding:0 5px;border-radius:5px;
  background:#f0a52a;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:-.02em}
.pt.ishost .nm .crown{display:inline-flex}
.pt .tag{position:absolute;right:5px;top:5px;height:19px;padding:0 6px;border-radius:6px;background:var(--blue);color:#fff;font-size:10.5px;font-weight:800;display:none;align-items:center}
.pt.sharing .tag{display:flex}
.pt .link{position:absolute;left:5px;top:5px;height:19px;padding:0 6px;border-radius:6px;background:rgba(29,35,48,.75);color:#fff;font-size:10.5px;font-weight:700;display:none;align-items:center}
.pt.linking .link,.pt.failed .link{display:flex}
.pt.failed .link{background:var(--coral)}
.pt .kick{position:absolute;right:4px;top:4px;width:22px;height:22px;border-radius:7px;background:rgba(29,35,48,.62);color:#fff;
  display:none;align-items:center;justify-content:center;padding:0}
.pt .kick svg.i{width:13px;height:13px;stroke-width:2.6}
.pt .kick:hover{background:var(--coral)}
body.host .pt:not(.me) .kick{display:flex}
body.host .pt:not(.me) .tag{right:30px}
.pt.slot{background:transparent;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px;font-weight:600}

.chat{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.ptab{height:26px;padding:0 11px;border-radius:9px;font-size:13.5px;font-weight:800;color:var(--sub);background:transparent}
.ptab.on{background:var(--well);color:var(--ink)}
.ptab.hasnew::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--coral);margin-left:5px;vertical-align:middle}
#notesWho{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:8rem}
.savebtn{display:none;height:26px;padding:0 10px;border-radius:9px;background:var(--blue);color:#fff;font-size:12px;font-weight:700;margin-left:8px}
body.view-notes .savebtn{display:block}
body.view-notes #notesWho{margin-left:auto}
#notes{display:none;flex:1 1 auto;min-height:0;width:100%;resize:none;border:none;outline:none;background:transparent;
  padding:10px 16px 14px;margin-top:6px;border-top:1px solid var(--line);font:inherit;font-size:14.5px;line-height:1.65;color:var(--ink)}
body.view-notes #log,body.view-notes .send{display:none}
body.view-notes #notes{display:block}
#log{flex:1 1 auto;overflow:auto;padding:6px 16px 6px;margin-top:6px;border-top:1px solid var(--line);min-height:0;font-size:13.5px;line-height:1.5}
.m{padding:1.5px 0;word-break:break-word;white-space:pre-wrap}
.m b{font-weight:700;margin-right:6px}
.m.me b{color:var(--blue)}
.m.sys{color:var(--faint);font-size:12.5px;font-weight:500}
.send{display:flex;gap:6px;padding:8px 10px 10px}
.send input{flex:1;min-width:0;height:40px;border-radius:12px;border:1.5px solid var(--line);padding:0 12px;background:#fff;font-size:14px}
.send input:focus{outline:none;border-color:var(--blue)}
.send button{width:40px;height:40px;border-radius:12px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--press)}
.send button svg.i{width:18px;height:18px}

/* 파일 보내기 */
.send{gap:5px}
.send .clip{width:40px;height:40px;border-radius:12px;background:var(--well);display:flex;align-items:center;justify-content:center;color:#4a5160;flex:0 0 auto}
.send .clip:hover{background:#e2dcd6}
.fmsg{display:inline-flex;align-items:center;gap:9px;margin:3px 0;padding:8px 11px;border-radius:13px;background:var(--well);max-width:100%}
.fmsg svg.i{width:16px;height:16px;flex:0 0 auto;color:#4a5160}
.fmsg .fn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9.5rem}
.fmsg .fs{font-size:12px;color:var(--sub);flex:0 0 auto}
.fmsg a{color:var(--blue);font-weight:700;text-decoration:none;flex:0 0 auto}
.fmsg .bar{width:64px;height:5px;border-radius:3px;background:#d9d3cd;overflow:hidden;flex:0 0 auto}
.fmsg .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s}
.fshot{display:block;max-width:100%;max-height:170px;border-radius:12px;margin:5px 0;cursor:pointer}

/* 조작 버튼 (채팅 아래) */
.ctrl{flex:0 0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.cb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:58px;border-radius:15px;background:var(--surface);box-shadow:var(--raise);
  font-size:12px;font-weight:700;color:#4a5160;transition:transform .12s, box-shadow .15s, background .15s}
.cb:hover{box-shadow:var(--raise-hi)}
.cb:active{transform:translateY(1px)}
.cb svg.i{width:20px;height:20px}
.cb.on{background:var(--blue);color:#fff;box-shadow:var(--press)}
.cb.leave{color:var(--coral)}
.cb.leave:hover{background:var(--coral);color:#fff}

#toast{position:fixed;left:50%;top:16px;pointer-events:none;transform:translate(-50%,-140px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:13px;font-size:14px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.2);transition:transform .25s;z-index:50;width:max-content;max-width:calc(100% - 32px);text-align:center}
#toast.show{transform:translate(-50%,0)}
#audios{display:none}

/* ─── 모바일 탭 / 안내 시트 ─── */
.mtabs{display:none}
.sheet{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(29,35,48,.5)}
.sheet.show{display:flex}
.sheet .scd{width:100%;max-width:420px;background:var(--surface);border-radius:26px;box-shadow:var(--raise-hi);padding:26px 24px 18px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:21px;font-weight:800;letter-spacing:-.02em}
.sheet p{margin:0 0 16px;color:var(--sub);font-size:14.5px}
.sheet ol{margin:0 0 18px;padding-left:20px;color:var(--ink);font-size:14.5px;line-height:1.75}
.sheet ol b{font-weight:800}
.sheet .col{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.sheet .col button{height:52px;border-radius:16px;font-size:16px;font-weight:700;background:var(--well);color:var(--ink);
  display:flex;align-items:center;justify-content:center;gap:8px}
.sheet .col .main{background:var(--blue);color:#fff;box-shadow:var(--press)}
.sheet .col .warn{color:var(--coral)}
.sheet .col .warn:hover{background:var(--coral);color:#fff}
.sheet .col svg.i{width:19px;height:19px}
.sheet .row{display:flex;gap:10px;margin-top:4px}
.sheet .row button{flex:1;height:50px;border-radius:16px;font-size:16px;font-weight:700}
.sheet .ok{background:var(--blue);color:#fff;box-shadow:var(--press)}
.sheet .no{background:var(--well);color:var(--sub)}

@media (max-width:900px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{padding:0}
  #entry{min-height:var(--appvh,100vh);height:var(--appvh,100vh);overflow:auto;padding:22px 16px calc(22px + env(safe-area-inset-bottom,0px))}

  /* 화면 높이를 직접 잡아서 키보드가 띄워도 레이아웃이 줄어들게 한다 */
  #room{position:fixed;left:0;top:0;width:100%;height:var(--appvh,100vh);
        display:flex;flex-direction:column;overflow:hidden}
  .top{flex:0 0 auto}
  .body{flex:1 1 auto}
  .top{padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;gap:8px}
  .body{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;
        padding:0 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .side{display:contents}

  /* 참여자: 가로 줄 (세로 공간을 아끼다) */
  .ppl{order:1;flex:0 0 auto;border-radius:16px}
  .ppl .phead{display:none}
  #people{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:7px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #people::-webkit-scrollbar{display:none}
  #people .pt{flex:0 0 auto;width:88px;aspect-ratio:4/3;border-radius:12px}
  #people .slot{display:none}
  .pt .nm{left:3px;right:3px;bottom:3px;height:19px;padding:0 5px;font-size:10.5px;border-radius:6px}
  .pt .nm svg.i{width:11px;height:11px}
  .pt .big .av{width:30px;height:30px;border-radius:10px;font-size:14px}
  .pt .tag,.pt .link{font-size:9px;height:16px;padding:0 4px;top:3px}
  .pt .tag{right:3px} .pt .link{left:3px}

  /* 화면 / 채팅 — 한 번에 하나씩만, 남는 공간을 전부 쓴다 */
  .stage{order:2;flex:1 1 auto;min-height:0;padding:10px;border-radius:18px}
  .chat{order:2;flex:1 1 auto;min-height:0;display:none;border-radius:18px}
  .chat .phead{display:none}
  body.view-notes .chat .phead{display:flex;align-items:center;padding:10px 14px 0}
  body.view-notes .chat .phead .ptab{display:none}
  body.view-notes #notes{padding-top:8px}
  #log{margin-top:0;border-top:none;padding:10px 14px}
  body.tab-chat .stage{display:none}
  body.tab-chat .chat{display:flex}
  .stage.focused{min-height:0}
  #shares{grid-template-columns:1fr 1fr;gap:9px}
  .stage.one #shares{grid-template-columns:1fr}

  /* 크게 보는 중: 영상은 꽉 채우고 나머지 공유는 아래 가로 줄 */
  .stage.focused{padding:8px}
  .stage.focused #viewer{border-radius:14px}
  .stage.focused #shares{display:flex;flex:0 0 auto;gap:8px;margin-top:8px;padding:1px;
                         overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
  .stage.focused #shares::-webkit-scrollbar{display:none}
  .stage.focused .scard{width:116px;flex:0 0 auto;padding:4px;border-radius:12px}
  .stage.focused.one #shares{display:none}

  /* 키보드가 올라오면 채팅에 공간을 몰아준다 */
  body.kb .top,body.kb .ppl,body.kb .mtabs,body.kb .ctrl{display:none}
  body.kb .body{padding-top:8px}
  #sempty{padding:14px 6px}
  #sempty .ic{display:none}
  #sempty h3{font-size:15px} #sempty p{font-size:13px}
  .invite{margin-top:14px;padding:8px 8px 8px 14px;gap:10px}
  .invite b{font-size:20px}

  /* 아래쪽: 탭 한 줄 + 버튼 도크 한 장 */
  .mtabs{order:3;flex:0 0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:7px}
  .mtabs button{height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:6px;
                font-size:13.5px;font-weight:700;color:var(--sub);background:var(--well);transition:background .15s,color .15s}
  .mtabs button.on{background:var(--blue);color:#fff;box-shadow:var(--press)}
  .mtabs svg.i{width:17px;height:17px}
  .mtabs .badge{min-width:19px;height:19px;padding:0 6px;border-radius:10px;background:var(--coral);color:#fff;
                font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center}
  .mtabs button.on .badge{background:#fff;color:var(--blue)}
  .mtabs .badge.on{display:flex}

  .ctrl{order:4;flex:0 0 auto;gap:4px;padding:7px;border-radius:20px;background:var(--surface);box-shadow:var(--raise-hi)}
  .cb{height:56px;border-radius:15px;background:transparent;box-shadow:none;font-size:11.5px;gap:5px}
  .cb:hover{box-shadow:none}
  .cb svg.i{width:21px;height:21px}
  .cb.on{background:var(--blue);color:#fff;box-shadow:var(--press)}
  .cb.leave{color:var(--coral)}
  .cb.leave:active{background:var(--coral);color:#fff}

  .send{padding:8px}
  .send input{height:44px;border-radius:14px;font-size:15px;min-width:0}
  .send .clip{width:40px;height:44px;border-radius:13px}
  .send button{width:44px;height:44px;border-radius:14px}

  /* 상단 바: 조금 낮게, 내용에 자리를 더 준다 */
  .top{padding:calc(6px + env(safe-area-inset-top,0px)) 12px 6px;gap:7px}
  .roompill,.stat,.fsbtn{height:34px}
  .roompill b{letter-spacing:.12em}

  /* 참여자 카드에 그림자를 줘서 띄게 */
  /* 알림은 위쪽 방 번호를 가리지 않게 아래쪽에 */
  #toast{top:auto;bottom:calc(174px + env(safe-area-inset-bottom,0px));transform:translate(-50%,180px);font-size:13.5px;padding:9px 15px}
  #toast.show{transform:translate(-50%,0)}

  #people .pt{box-shadow:var(--raise)}
  #people .pt.me{box-shadow:0 0 0 2px rgba(46,106,230,.35), var(--raise)}
  #people .pt.speaking{box-shadow:0 0 0 3px var(--green)}
  #people .pt.bigcam{box-shadow:0 0 0 3px var(--blue)}
  /* 폰에서는 이름이 짧아서 방장 칩을 왼쪽 위로 뺀다 */
  #people .pt .nm .crown{display:none !important}
  #people .pt.ishost::after{content:'방장';position:absolute;left:3px;top:3px;height:15px;padding:0 5px;border-radius:5px;
    background:#f0a52a;color:#fff;font-size:9px;font-weight:800;display:flex;align-items:center;z-index:2}
  #people .pt.ishost .link{left:42px}

  .top{padding-bottom:6px}
  .roompill{margin-left:0}
}

@media (max-width:560px){
  .brand{display:none}
  .top{gap:8px;flex-wrap:nowrap}
  .roompill,.stat,.fsbtn{white-space:nowrap}
  .roompill>span{display:none}
  .roompill{padding:0 4px 0 12px;gap:8px} .roompill b{font-size:16px}
  .roompill button{padding:0 9px}
  .stat{padding:0 11px;font-size:12.5px;gap:6px}
  .fsbtn{padding:0 11px}
  .fsbtn span{display:none}
  .vbar{left:8px;right:8px;top:8px;gap:6px}
  .vchip,.vbtn{height:30px;font-size:12px;white-space:nowrap}
  .vchip{max-width:55%;overflow:hidden}
  .vbtn span.lb{display:none}
  .vbtn{padding:0 8px}
  .scard{padding:5px;border-radius:13px}
  .sfoot{padding:6px 3px 1px}
  .sfoot .sub,.sfoot .open,.shead em{display:none}
  .sfoot b{font-size:12.5px}
  .cb{height:50px}
  .cb svg.i{width:19px;height:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<section id="entry">
  <div class="ecard">
    <h1>같이봐요</h1>
    <p class="lead">화면 공유하면서 얼굴 보고 얘기해요. 최대 <b id="maxN">8</b>명.</p>
    <label class="lbl" for="nick">닉네임</label>
    <input class="tin" id="nick" maxlength="10" placeholder="다른 사람에게 보일 이름" autocomplete="off">
    <div class="choices">
      <button class="choice" id="cHost"><svg class="i"><use href="#i-plus"/></svg><span class="ct">방 만들기</span><small>초대 코드 생성</small></button>
      <button class="choice" id="cJoin"><svg class="i"><use href="#i-in"/></svg>방 참여하기<small>코드 입력</small></button>
      <div class="joinbox" id="joinBox" hidden>
        <input class="tin" id="code" maxlength="4" placeholder="4자리 코드" autocomplete="off" spellcheck="false">
        <button class="gobtn" id="go">들어가기</button>
      </div>
      <button class="choice ghost" id="cPractice"><svg class="i"><use href="#i-spark"/></svg>연습 모드로 둘러보기</button>
    </div>
    <div class="eerr" id="eerr"></div>
  </div>
</section>

<section id="room" hidden>
  <header class="top">
    <div class="brand"><i></i>같이봐요</div>
    <div class="roompill"><span>방</span><b id="rcode"></b><button id="inv"><svg class="i"><use href="#i-copy"/></svg>초대 복사</button></div>
    <div class="stat" id="stat"><i></i><span id="statT">연결 중</span></div>
    <button class="fsbtn" id="fsB" title="전체화면 (F11)"><svg class="i"><use href="#i-expand"/></svg><span>전체화면</span></button>
  </header>

  <div class="body">
    <section class="stage none" id="stage">
      <div class="shead"><h2>공유 중인 화면</h2><span id="scount"></span><em>보고 싶은 화면을 누르면 크게 보여요</em></div>
      <div id="viewer">
        <video id="vv" playsinline autoplay muted></video>
        <div class="vbar">
          <div class="vchip"><span class="av" id="vav"></span><span id="vname"></span></div>
          <button class="vbtn" id="vfull"><svg class="i"><use href="#i-expand"/></svg><span class="lb">전체화면</span></button>
          <button class="vbtn" id="vclose"><svg class="i"><use href="#i-x"/></svg><span class="lb">작게 보기</span></button>
        </div>
      </div>
      <div id="shares"></div>
      <div id="sempty">
        <div class="ic"><svg class="i"><use href="#i-screen"/></svg></div>
        <h3>아직 공유 중인 화면이 없어요</h3>
        <p>누군가 화면 공유를 켜면 여기에 작게 나타나요. 눌러서 크게 볼 수 있어요.</p>
        <div class="invite"><span>초대 코드</span><b id="icode"></b><button id="inv2"><svg class="i"><use href="#i-copy"/></svg>복사</button></div>
      </div>
    </section>

    <aside class="side">
      <section class="panel ppl">
        <div class="phead"><h2>참여자</h2><span id="pcount">1</span><span id="hostname"></span></div>
        <div id="people"></div>
      </section>
      <section class="panel chat">
        <div class="phead">
          <button class="ptab on" id="pvChat">채팅</button>
          <button class="ptab" id="pvNotes">회의록</button>
          <span id="notesWho"></span>
          <button class="savebtn" id="notesSave">저장</button>
        </div>
        <div id="log"></div>
        <div class="send"><button class="clip" id="bPhoto" aria-label="사진 보내기"><svg class="i"><use href="#i-photo"/></svg></button><button class="clip" id="bFile" aria-label="파일 보내기"><svg class="i"><use href="#i-clip"/></svg></button><input type="file" id="photoIn" accept="image/*" hidden><input type="file" id="fileIn" hidden><input type="file" id="shareImgIn" accept="image/*" hidden><input id="msg" placeholder="메시지 보내기" autocomplete="off"><button id="sendB" aria-label="보내기"><svg class="i"><use href="#i-send"/></svg></button></div>
        <textarea id="notes" spellcheck="false" placeholder="여기에 같이 적어요. 적는 대로 모두에게 바로 보입니다."></textarea>
      </section>
      <nav class="mtabs" id="mtabs">
        <button id="tabStage" class="on"><svg class="i"><use href="#i-screen"/></svg>화면</button>
        <button id="tabChat"><svg class="i"><use href="#i-chat"/></svg>채팅<span class="badge" id="unread">0</span></button>
        <button id="tabNotes"><svg class="i"><use href="#i-note"/></svg>회의록</button>
      </nav>
      <nav class="ctrl">
        <button class="cb" id="bMic"><svg class="i"><use href="#i-micoff"/></svg><span class="t">마이크</span></button>
        <button class="cb" id="bCam"><svg class="i"><use href="#i-camoff"/></svg><span class="t">카메라</span></button>
        <button class="cb" id="bShare"><svg class="i"><use href="#i-screen"/></svg><span class="t">화면 공유</span></button>
        <button class="cb leave" id="bLeave"><svg class="i"><use href="#i-leave"/></svg><span class="t">나가기</span></button>
      </nav>
    </aside>
  </div>
</section>

<div class="sheet" id="pmenu">
  <div class="scd">
    <h3 id="pmT">참여자</h3>
    <p id="pmP">이 사람에게 할 일을 고르세요.</p>
    <div class="col">
      <button class="main" id="pmGive"></button>
      <button class="warn" id="pmKick"></button>
      <button id="pmNo">닫기</button>
    </div>
  </div>
</div>
<div class="sheet" id="perm">
  <div class="scd">
    <h3 id="permT">카메라·마이크 권한이 필요해요</h3>
    <p id="permP"></p>
    <ol id="permS"></ol>
    <div class="row">
      <button class="no" id="permNo">닫기</button>
      <button class="ok" id="permOk">허용하기</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="audios"></div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></symbol>
  <symbol id="i-micoff" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3M4 4l16 16"/></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3z"/></symbol>
  <symbol id="i-camoff" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="M16 10.5l5-3v9l-5-3zM3 3l18 18"/></symbol>
  <symbol id="i-screen" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4M9.5 7.5l5 5M14.5 7.5l-5 5"/></symbol>
  <symbol id="i-leave" viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
  <symbol id="i-shrink" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H7l-4 3 1.2-4.2A8 8 0 1 1 21 12z"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.8-8.8a3.3 3.3 0 0 1 4.7 4.7l-8.8 8.8a1.6 1.6 0 0 1-2.3-2.3l8.1-8.1"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path d="M4 18h16M4 18l-1.5-9 5 3.5L12 5l4.5 7.5 5-3.5L20 18"/></symbol>
  <symbol id="i-photo" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><circle cx="8.5" cy="10" r="1.6"/><path d="M3.5 17l5-5 4.5 4.5 3-2.5 4.5 4"/></symbol>
  <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-2.5-6.5z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><path d="M12 8v8M8 12h8"/></symbol>
  <symbol id="i-in" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M9 7l5 5-5 5M14 12H3"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
</svg>

</script>
<script>
/* ═══ 설정 ═══ */
const DB_URL = 'https://led-panel-3630e-default-rtdb.firebaseio.com';   // 연결 중계용 (sv_rooms 경로만 사용)
const ROOT   = 'sv_rooms';
const MAX    = 8;
const WEB_URL = 'https://imist.co.kr/meet/';   // 파일로 열었을 때 쓸 초대 주소
const ICE    = { iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.cloudflare.com:3478']}] };
const HUES   = ['#2e6ae6','#ee6352','#23b37a','#9b5de5','#f0a52a','#1fa5b8'];

/* 폰·태블릿은 영상 인코딩이 버거워 멈추기 쉬우므로 상한을 둔다 */
const IS_PHONE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
              || (navigator.maxTouchPoints>1 && /Macintosh/.test(navigator.userAgent));
const CAM_CONSTRAINTS = IS_PHONE
  ? { width:{ideal:320}, height:{ideal:240}, frameRate:{ideal:12,max:15} }
  : { width:{ideal:640}, height:{ideal:480}, frameRate:{ideal:24} };
const CAP_CAM    = IS_PHONE ? 250000 : 600000;     // 카메라 최대 비트레이트
const CAP_SCREEN = IS_PHONE ? 800000 : 1500000;    // 화면 공유 최대 비트레이트

const $ = id => document.getElementById(id);
const ico = n => '<svg class="i"><use href="#i-'+n+'"/></svg>';

/* ═══ 상태 ═══ */
let mode=null, db=null, roomCode=null, myId=null, myName='', joined=false, hostId=null;
let listeners=[];
const conns={};           // 상대 id -> {pc, dc, init, cands, q}
const people={};          // 화면에 보이는 사람
let screenStream=null, micStream=null, camStream=null;
let actx=null, mixNodes=[], mixTrack=null, focusId=null, focusKind='share';

/* ═══ 공통 ═══ */
let toastT=null;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT);
  // 폰에서는 짧게 띄웠다 사라진다 (들어온 사람·공유 시작 알림은 채팅에도 남는다)
  const ms = (window.matchMedia && window.matchMedia('(max-width:900px)').matches) ? 1400 : 2600;
  toastT=setTimeout(()=>t.classList.remove('show'), ms);
}
function initial(n){ return (n||'?').trim().slice(0,1).toUpperCase(); }
function hueOf(id){ let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))>>>0; return HUES[h%HUES.length]; }
function rid(n){ const a='abcdefghijkmnpqrstuvwxyz23456789'; let s=''; for(let i=0;i<n;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function randCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function ensureActx(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
function withTimeout(p,ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]); }

/* ═══ 채팅 ═══ */
function logLine(el){ const L=$('log'); const atEnd=L.scrollHeight-L.scrollTop-L.clientHeight<40; L.appendChild(el); if(atEnd) L.scrollTop=L.scrollHeight; }
function addChat(text,name,me){
  const d=document.createElement('div'); d.className='m'+(me?' me':'');
  const b=document.createElement('b'); b.textContent=name; d.appendChild(b); d.appendChild(document.createTextNode(text));
  logLine(d); if(me) $('log').scrollTop=$('log').scrollHeight; else bumpUnread();
}
function addSys(text){ const d=document.createElement('div'); d.className='m sys'; d.textContent=text; logLine(d); }

/* ═══ 사람 ═══ */
function person(id,name,isMe){
  let P=people[id];
  if(!P){
    P=people[id]={ id, name:name||'참가자', me:!!isMe, mic:false, rs:{}, camStream:null, shareStream:null, tile:null, card:null,
                   audioEl:null, an:null, buf:null, level:0, fakeTalk:null, shareMS:null, camMS:null, audioMS:null };
    const t=document.createElement('div'); t.className='pt'+(isMe?' me':' linking');
    t.innerHTML='<video playsinline autoplay muted></video><div class="big"><span class="av"></span></div><span class="link">연결 중…</span><span class="tag">공유 중</span>'+
                '<button class="kick" title="참여자 관리">'+ico('more')+'</button>'+
                '<div class="nm"><span class="crown">방장</span><span class="t"></span>'+ico('micoff')+'</div>';
    if(!isMe) t.querySelector('.kick').onclick=ev=>{ ev.stopPropagation(); openPeopleMenu(id); };
    t.title='큰 화면으로 보기';
    t.onclick=()=>focusCam(id);
    P.tile=t;
    if(isMe) $('people').prepend(t); else $('people').appendChild(t);
  }
  if(name) P.name=name;
  paint(P); renderPeople();
  return P;
}
function paint(P){
  if(!P.tile) return;
  P.tile.querySelector('.nm .t').textContent = P.me ? P.name+' (나)' : P.name;
  const av=P.tile.querySelector('.av'); av.textContent=initial(P.name); av.style.background=hueOf(P.me?'me':P.id);
  P.tile.classList.toggle('camon', !!P.camStream);
  P.tile.classList.toggle('micoff', !P.mic);
  P.tile.classList.toggle('sharing', !!P.shareStream);
  if(P.card){
    const a=P.card.querySelector('.av'); a.textContent=initial(P.name); a.style.background=av.style.background;
    P.card.querySelector('b').textContent = P.me ? '내 화면' : P.name;
    P.card.querySelector('.sub').textContent = P.me ? '' : '님 화면';
  }
}
function setLink(P,state){
  if(!P || !P.tile || P.me) return;
  const t=P.tile, l=t.querySelector('.link');
  t.classList.remove('linking','failed');
  if(state==='connected') return;
  if(state==='failed'){ t.classList.add('failed'); l.textContent='연결 실패'; }
  else { t.classList.add('linking'); l.textContent='연결 중…'; }
}
function dropPerson(id){
  const P=people[id]; if(!P) return;
  setShare(P,null); setCam(P,null); setAudio(P,null);
  if(P.tile) P.tile.remove();
  delete people[id]; renderPeople();
}
function focusCam(id){
  const P=people[id]; if(!P) return;
  if(!P.camStream){
    if(P.shareStream){ focusId=id; focusKind='share'; renderStage(); if(isSmall()) setTab('stage'); return; }
    toast(P.me ? '내 카메라가 꺼져 있어요' : P.name+'님이 카메라를 켜지 않았어요');
    return;
  }
  if(focusId===id && focusKind==='cam'){ focusId=null; autoFocusDone=true; renderStage(); return; }
  focusId=id; focusKind='cam'; renderStage();
  if(isSmall()) setTab('stage');
}
function paintHost(){
  let hname='';
  Object.values(people).forEach(p=>{
    const is = p.me ? (!!hostId && hostId===myId) : (p.id===hostId);
    if(is) hname = p.me ? '나' : p.name;
    if(p.tile) p.tile.classList.toggle('ishost', is);
  });
  const h=$('hostname'); if(h) h.textContent = hname ? '방장 · '+hname : '';
}
function setHost(id){
  const was = (hostId===myId);
  hostId = id;
  const now = (hostId===myId);
  document.body.classList.toggle('host', now);
  paintHost();
  if(now && !was && joined) addSys('이제 내가 방장이에요');
  else if(!now && hostId && joined){

function syncRemote(P){
  setShare(P, P.rs.share && P.shareMS ? P.shareMS : null);
  setCam(P,   P.rs.cam   && P.camMS   ? P.camMS   : null);
  P.mic=!!P.rs.mic; paint(P);
}
function applyState(P,s){
  s=s||{};
  if(P._init){
    if(!!s.share!==!!P.rs.share){ const m=P.name+(s.share?'님이 화면 공유를 시작했어요':'님이 화면 공유를 멈췄어요'); addSys(m); if(s.share) toast(m); }
    if(s.cam && !P.rs.cam) addSys(P.name+'님이 카메라를 켰어요');
  }
  P._init=true; P.rs=s; syncRemote(P);
}

/* ═══ 연결 (Firebase로 신호만 주고받고, 영상·소리는 직접 연결) ═══ */
function roomRef(p){ return db.ref(ROOT+'/'+roomCode+(p?'/'+p:'')); }
function signal(to,type,data){ roomRef('sig/'+to).push({from:myId,type,data:JSON.stringify(data)}); }
function myState(){ return { mic:!!micStream, cam:!!camStream, share:!!screenStream }; }
function dcSend(C,o){ if(C.dc && C.dc.readyState==='open') try{ C.dc.send(JSON.stringify(o)); }catch(e){} }
function tx(o){ Object.values(conns).forEach(C=>dcSend(C,o)); }
function sendState(){ tx({t:'state',s:myState()}); }

function capSender(sender, maxBitrate, pref){
  if(!sender) return;
  try{
    const p = sender.getParameters();
    if(!p.encodings || !p.encodings.length) p.encodings=[{}];
    p.encodings[0].maxBitrate = maxBitrate;
    p.degradationPreference = pref;
    sender.setParameters(p).catch(()=>{});
  }catch(e){}
}
function capFor(base){
  // 상대가 많을수록 1명당 화질을 낮춘다 (8명이면 내 업로드가 7배가 된다)
  const n = Math.max(1, Object.keys(conns).length);
  const f = n<=2 ? 1 : (n<=4 ? 0.6 : 0.4);
  return Math.round(base*f);
}
function applyTracks(C){
  const ts=C.pc.getTransceivers(); if(ts.length<3) return;
  const sv=screenStream?screenStream.getVideoTracks()[0]:null, cv=camStream?camStream.getVideoTracks()[0]:null;
  ts[0].sender.replaceTrack(sv).catch(()=>{});
  ts[1].sender.replaceTrack(mixTrack).catch(()=>{});
  ts[2].sender.replaceTrack(cv).catch(()=>{});
  // 폰이 과부하로 멈추지 않게 보내는 양을 제한한다
  capSender(ts[0].sender, capFor(CAP_SCREEN), 'maintain-resolution');  // 화면은 글자가 보여야 하니 해상도 우선
  capSender(ts[2].sender, capFor(CAP_CAM),    'balanced');
}
function applyAll(){ Object.values(conns).forEach(applyTracks); }

function ensureConn(id){
  if(conns[id]) return conns[id];
  const pc=new RTCPeerConnection(ICE);
  const C=conns[id]={ id, pc, dc:null, init: myId>id, cands:[], q:Promise.resolve(), restarts:0 };
  pc.onicecandidate=e=>{ if(e.candidate) signal(id,'cand',e.candidate.toJSON()); };
  pc.ontrack=e=>{
    const idx=pc.getTransceivers().indexOf(e.transceiver), P=person(id), ms=new MediaStream([e.track]);
    if(idx===0) P.shareMS=ms; else if(idx===1){ P.audioMS=ms; setAudio(P,ms); } else if(idx===2) P.camMS=ms;
    syncRemote(P);
  };
  pc.ondatachannel=e=>bindDC(C,e.channel);
  pc.onconnectionstatechange=()=>{
    const s=pc.connectionState; setLink(people[id],s);
    if(s==='failed' && C.init && C.restarts<2){ C.restarts++; try{ pc.restartIce(); }catch(e){} }
    if(s==='failed' && C.restarts>=2 && people[id]) toast(people[id].name+'님과 직접 연결이 안 돼요. 네트워크가 막고 있을 수 있어요.');
  };
  if(C.init){
    ['video','audio','video'].forEach(k=>pc.addTransceiver(k,{direction:'sendrecv'}));
    applyTracks(C);
    bindDC(C, pc.createDataChannel('chat'));
    pc.onnegotiationneeded=()=>{ C.q=C.q.then(async()=>{
      try{ await pc.setLocalDescription(); signal(id,'desc',{type:pc.localDescription.type,sdp:pc.localDescription.sdp}); }catch(e){}
    }); };
  }
  return C;
}
function onSignal(from,type,data){
  const C=ensureConn(from), pc=C.pc;
  C.q=C.q.then(async()=>{
    try{
      if(type==='desc'){
        if(data.type==='offer'){
          if(C.init) return;
          await pc.setRemoteDescription(data);
          pc.getTransceivers().forEach(t=>{ if(t.direction!=='sendrecv') t.direction='sendrecv'; });
          applyTracks(C);
          await pc.setLocalDescription();
          signal(from,'desc',{type:pc.localDescription.type,sdp:pc.localDescription.sdp});
        }else if(pc.signalingState==='have-local-offer'){ await pc.setRemoteDescription(data); }
        for(const c of C.cands.splice(0)) try{ await pc.addIceCandidate(c); }catch(e){}
      }else if(type==='cand'){
        if(pc.remoteDescription) await pc.addIceCandidate(data).catch(()=>{}); else C.cands.push(data);
      }
    }catch(e){ console.warn('signal',e); }
  });
}
function bindDC(C,dc){
  C.dc=dc; try{ dc.binaryType='arraybuffer'; }catch(e){}
  dc.onopen=()=>dcSend(C,{t:'hello',name:myName,s:myState()});
  dc.onmessage=e=>{
    if(typeof e.data !== 'string'){ onFileChunk(C, e.data); return; }
    let m; try{ m=JSON.parse(e.data); }catch(x){ return; }
    const P=person(C.id);
    if(m.t==='hello'){ if(m.name) { P.name=String(m.name).slice(0,10); paint(P); } applyState(P,m.s); }
    else if(m.t==='state') applyState(P,m.s);
    else if(m.t==='chat') addChat(String(m.text||''),P.name,false);
    else if(m.t==='kick'){ if(C.id===hostId) kicked(); }   // 방장이 보낸 것만
    else if(m.t==='file'){
      const size=Math.min(Number(m.size)||0, MAXFILE);
      if(!size) return;
      const name=String(m.name||'file').slice(0,80);
      C.rx={ name, size, mime:String(m.mime||''), parts:[], got:0, who:P.name,
             box:fileLine(name, size, P.name, false) };
    }
  };
}
function closeConn(id){
  const C=conns[id]; if(!C) return;
  try{ C.pc.close(); }catch(e){}
  delete conns[id];
}

function initDB(){
  if(db) return db;
  firebase.initializeApp({ databaseURL: DB_URL });
  db=firebase.database();
  const emu=(location.search.match(/[?&]emu=([^&]+)/)||[])[1];
  if(emu){ const [h,p]=decodeURIComponent(emu).split(':'); db.useEmulator(h,+p); }
  return db;
}
async function enterNet(code, initialIds){
  roomCode=code; myId=rid(10);
  const me=roomRef('members/'+myId), inbox=roomRef('sig/'+myId);
  await me.onDisconnect().remove(); await inbox.onDisconnect().remove();
  await me.set({ name:myName, at:firebase.database.ServerValue.TIMESTAMP });
  if(mode==='host'){ try{ await roomRef('host').set(myId); }catch(e){} }
  enterRoom();
  const known=new Set(initialIds||[]);
  const mem=roomRef('members');
  const onAdd=mem.on('child_added', s=>{
    const id=s.key, v=s.val()||{}; if(id===myId) return;
    const P=person(id, String(v.name||'참가자').slice(0,10)); setLink(P,'new');
    if(!known.has(id)) addSys(P.name+'님이 들어왔어요');
    ensureConn(id);
    verifyHost();
    setTimeout(applyAll, 1500);   // 인원이 바뀌면 화질 상한을 다시 건다
  });
  const onRem=mem.on('child_removed', s=>{
    const id=s.key; if(id===myId) return;
    const P=people[id]; if(P) addSys(P.name+'님이 나갔어요');
    closeConn(id); dropPerson(id);
    verifyHost();
    setTimeout(applyAll, 500);   // 방장이 나갔으면 남은 사람 중 가장 먼저 온 사람이 이어받는다
  });
  const href=roomRef('host');
  const onHost=href.on('value', s=>{ setHost(s.val()||null); });
  const nref=roomRef('notes');
  const onNotes=nref.on('value', s=>onNotesValue(s.val()));
  const onSig=inbox.on('child_added', s=>{
    const v=s.val(); s.ref.remove();
    if(!v || !v.from) return;
    let d; try{ d=JSON.parse(v.data); }catch(e){ return; }
    onSignal(v.from, v.type, d);
  });
  listeners=[[mem,'child_added',onAdd],[mem,'child_removed',onRem],[inbox,'child_added',onSig],[href,'value',onHost],[nref,'value',onNotes]];
  verifyHost();
}

function rebuildMix(){

  if(screenStream) screenStream.getAudioTracks().forEach(t=>srcs.push(t));

       srcs.forEach(t=>{ const n=ctx.createMediaStreamSource(new MediaStream([t])); n.connect(dest); mixNodes.push(n); });

function imageToStream(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      const maxW=1280, k=Math.min(1, maxW/(img.width||1));
      const c=document.createElement('canvas');
      c.width=Math.max(2,Math.round((img.width||640)*k));
      c.height=Math.max(2,Math.round((img.height||480)*k));
      const g=c.getContext('2d');
      const draw=()=>{ g.fillStyle='#161a22'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); };
      draw();
      // 사진은 움직이지 않으니, 1초에 한 번 다시 그려서 영상이 끊기지 않게 한다
      const timer=setInterval(draw,1000);
      URL.revokeObjectURL(url);
      res({ stream:c.captureStream(1), timer });
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('이미지를 읽지 못했어요')); };
    img.src=url;
  });
}

const painters=[]; let paintTimer=null;
function canvasStream(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); painters.push(()=>draw(g,w,h,performance.now()/1000)); draw(g,w,h,0);
  if(!paintTimer) paintTimer=setInterval(()=>painters.forEach(f=>f()),66);
  return c.captureStream(15);
}

function drawCam(color){ return (g,w,h,t)=>{

  const y=Math.sin(t*1.6)*4, x=Math.sin(t*0.7)*6;
  g.fillStyle=color; g.globalAlpha=.9; g.beginPath(); g.ellipse(w/2+x,h*0.98,w*0.3,h*0.34,0,0,Math.PI*2); g.fill();
  g.globalAlpha=1; g.fillStyle='#f3c9a8'; g.beginPath(); g.arc(w/2+x,h*0.42+y,h*0.2,0,Math.PI*2); g.fill();
  g.fillStyle='#3b2f2a'; g.beginPath(); g.arc(w/2+x,h*0.36+y,h*0.2,Math.PI,Math.PI*2); g.fill();
  const bl=(t%4)<0.12?1:5; g.fillStyle='#2b2b2b'; g.fillRect(w/2+x-h*0.08,h*0.43+y,6,bl); g.fillRect(w/2+x+h*0.06,h*0.43+y,6,bl);
};}

  [[40,'#c792ea',120],[60,'#82aaff',200],[60,'#c3e88d',160],[80,'#f78c6c',240],[60,'#82aaff',140],[40,'#c792ea',90],[40,'#89ddff',260],[60,'#c3e88d',180],[80,'#ffcb6b',120],[40,'#c792ea',60]]

function drawSheet(g,w,h,t){
  g.fillStyle='#fff'; g.fillRect(0,0,w,h);
  const cw=100,rh=30,cols=6,rows=11;
  g.fillStyle='#f1f3f6'; g.fillRect(0,0,w,rh); g.fillRect(0,0,50,h);
  g.strokeStyle='#e1e5ea'; g.lineWidth=1;
  for(let c=0;c<=cols;c++){ g.beginPath(); g.moveTo(50+c*cw,0); g.lineTo(50+c*cw,h); g.stroke(); }
  for(let r=0;r<=rows;r++){ g.beginPath(); g.moveTo(0,r*rh); g.lineTo(w,r*rh); g.stroke(); }
  g.fillStyle='#707784'; g.font='600 13px '+F; 'ABCDEF'.split('').forEach((l,i)=>g.fillText(l,50+i*cw+44,20));
  for(let r=1;r<rows;r++) g.fillText(String(r),20,r*rh+20);
  g.fillStyle='#1d2330'; g.font='500 14px '+F;
  for(let r=1;r<rows;r++) for(let c=0;c<cols;c++){ if((r*7+c*3)%5===0) continue; g.fillText(String(((r*37+c*91)%900)+100),50+c*cw+18,r*rh+20); }
  const k=Math.floor(t)%10+1, cc=Math.floor(t/2)%cols; g.strokeStyle='#23b37a'; g.lineWidth=2.5; g.strokeRect(50+cc*cw+1,k*rh+1,cw-2,rh-2);
}

    const box=fileLine(file.name, file.size, myName, true);
    const buf=await file.arrayBuffer();
    doneLine(box, new Blob([buf],{type:file.type||'application/octet-stream'}), file.name, file.type);
    botReply(); return;
  }
  const targets=Object.values(conns).filter(C=>C.dc && C.dc.readyState==='open');
  if(!targets.length){ addSys('아직 방에 아무도 없어요'); return; }
  sending=true;
  const box=fileLine(file.name, file.size, myName, true);
  try{
    const size=file.size;
    targets.forEach(C=>dcSend(C,{t:'file', name:file.name, size, mime:file.type||''}));
    let off=0;
    while(off < size){
      // 조각만 읽어서 보낸다 (큰 파일을 통째로 메모리에 올리면 폰이 멈춘다)
      const part=await file.slice(off, off+CHUNK).arrayBuffer();
      for(const C of targets){
        if(!C.dc || C.dc.readyState!=='open') continue;
        await waitBuf(C.dc);
        try{ C.dc.send(part); }catch(e){}
      }
      off += CHUNK; setProg(box, off/size);
    }
    doneLine(box, file, file.name, file.type);
    toast('파일을 보냈어요');
  }catch(e){ toast('파일을 보내지 못했어요'); }
  sending=false;
}
function onFileChunk(C, data){
  const R=C.rx; if(!R) return;
  R.parts.push(data); R.got += (data.byteLength || data.size || 0);
  setProg(R.box, R.got/R.size);
  if(R.got >= R.size){
    C.rx=null;
    doneLine(R.box, new Blob(R.parts,{type:R.mime||'application/octet-stream'}), R.name, R.mime);
    toast(R.who+'님이 파일을 보냈어요'); bumpUnread();
  }
}
$('bFile').onclick=()=>$('fileIn').click();
$('bPhoto').onclick=()=>$('photoIn').click();
$('photoIn').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; sendFile(f); };
$('fileIn').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; sendFile(f); };
$('log').addEventListener('dragover', e=>{ e.preventDefault(); });
$('log').addEventListener('drop', e=>{ e.preventDefault(); const f=e.dataTransfer && e.dataTransfer.files[0]; if(f) sendFile(f); });

/* ═══ 회의록 (모두 같이 보고 쓰기) ═══ */
let notesTimer=null, notesTypedAt=0, notesPending=null;
function applyNotes(t){
  const el=$('notes'); if(el.value===t) return;
  const top=el.scrollTop; el.value=t; el.scrollTop=top;
}
function pushNotes(){
  if(mode==='practice' || !db || !roomCode) return;
  try{ roomRef('notes').set({ text:$('notes').value.slice(0,20000), by:myId, name:myName,
                              at:firebase.database.ServerValue.TIMESTAMP }); }catch(e){}
}
$('notes').addEventListener('input',()=>{
  notesTypedAt=Date.now();
  clearTimeout(notesTimer); notesTimer=setTimeout(pushNotes,400);
});
// 내가 타이핑을 멈추면, 밀어뒀던 남의 수정을 반영한다
setInterval(()=>{
  if(notesPending!==null && Date.now()-notesTypedAt>2500){ applyNotes(notesPending); notesPending=null; }
},1000);
function onNotesValue(v){
  if(!v) return;
  if(v.by===myId) return;
  const who = v.name ? v.name+'님이 쓰는 중' : '';
  $('notesWho').textContent = who;
  clearTimeout($('notesWho')._t);
  $('notesWho')._t = setTimeout(()=>{ $('notesWho').textContent=''; },3000);
  if(Date.now()-notesTypedAt < 2500){ notesPending = v.text||''; return; }
  applyNotes(v.text||'');
}
$('notesSave').onclick=()=>{
  const t=$('notes').value;
  if(!t.trim()){ toast('아직 적은 내용이 없어요'); return; }
  const blob=new Blob([t],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='회의록 '+roomCode+'.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('회의록을 저장했어요');
};

/* ═══ 모바일: 탭 · 키보드 ═══ */
const isSmall = ()=>window.matchMedia('(max-width:900px)').matches;
let unreadN=0;
let curTab='stage';
function setTab(t){
  curTab=t;
  document.body.classList.toggle('tab-chat', t!=='stage');
  document.body.classList.toggle('view-notes', t==='notes');
  $('tabStage').classList.toggle('on', t==='stage');
  $('tabChat').classList.toggle('on', t==='chat');
  $('tabNotes').classList.toggle('on', t==='notes');
  $('pvChat').classList.toggle('on', t!=='notes');
  $('pvNotes').classList.toggle('on', t==='notes');
  if(t==='chat'){ unreadN=0; $('unread').classList.remove('on'); $('pvChat').classList.remove('hasnew');
                  setTimeout(()=>{ const L=$('log'); L.scrollTop=L.scrollHeight; },40); }
}
$('tabStage').onclick=()=>setTab('stage');
$('tabChat').onclick=()=>setTab('chat');
$('tabNotes').onclick=()=>setTab('notes');
$('pvChat').onclick=()=>setTab(isSmall()?'chat':'chat');
$('pvNotes').onclick=()=>setTab('notes');
function chatVisible(){
  if(document.body.classList.contains('view-notes')) return false;
  return !isSmall() || document.body.classList.contains('tab-chat');
}
function bumpUnread(){
  if(chatVisible()) return;
  unreadN++; const b=$('unread'); b.textContent = unreadN>99?'99+':unreadN; b.classList.add('on');
  $('pvChat').classList.add('hasnew');
}
/* 화면 높이를 실제 보이는 높이로 맞춘다 → 키보드가 띄어도 입력칸이 가려지지 않음 */
let baseVH=0;
function fitVH(){
  const vv=window.visualViewport;
  const h=Math.round(vv?vv.height:window.innerHeight);
  document.documentElement.style.setProperty('--appvh',h+'px');
  if(h>baseVH) baseVH=h;
  document.body.classList.toggle('kb', isSmall() && baseVH-h>120 && document.body.classList.contains('tab-chat'));
}
if(window.visualViewport){
  visualViewport.addEventListener('resize',fitVH);
  visualViewport.addEventListener('scroll',fitVH);
}
window.addEventListener('resize',fitVH);
window.addEventListener('orientationchange',()=>{ baseVH=0; setTimeout(fitVH,300); });
fitVH();
$('msg').addEventListener('focus',()=>{
  if(!isSmall()) return;
  setTab('chat');
  setTimeout(()=>{ window.scrollTo(0,0); fitVH(); const L=$('log'); L.scrollTop=L.scrollHeight; },250);
});
$('msg').addEventListener('blur',()=>{ if(isSmall()) setTimeout(()=>{ window.scrollTo(0,0); fitVH(); },100); });

});
